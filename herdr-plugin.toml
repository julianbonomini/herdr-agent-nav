id = "herdr.agent-nav"
name = "Herdr Agent Nav"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Opinionated keyboard-first agent navigation and naming tools."
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "src/restore-active-view.js"]

[[actions]]
id = "toggle-active-view"
title = "Toggle active-agent sidebar view"
command = ["node", "src/toggle-active-view.js"]

[[actions]]
id = "open-active-picker"
title = "Open active-agent picker"
command = ["node", "src/open-popup.js", "picker"]

[[actions]]
id = "open-rename"
title = "Rename focused agent"
command = ["node", "src/open-popup.js", "rename"]

[[panes]]
id = "picker"
title = "Active agents"
placement = "popup"
width = "60%"
height = 18
command = ["node", "src/active-picker.js"]

[[panes]]
id = "rename"
title = "Rename agent"
placement = "popup"
width = "50%"
height = 8
command = ["node", "src/rename-agent.js"]
