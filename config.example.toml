# Add one of these to ~/.config/herdr/config.toml, then reload the config.

[[keys.command]]
key = "prefix+g"
type = "shell"
command = "herdr plugin action invoke herdr.power-tools.toggle-active-view"
description = "toggle active agents"

# Alternative to the view toggle: open a keyboard picker of active agents.
# [[keys.command]]
# key = "prefix+g"
# type = "shell"
# command = "herdr plugin action invoke herdr.power-tools.open-active-picker"
# description = "jump to active agent"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "herdr plugin action invoke herdr.power-tools.open-rename"
description = "rename focused agent"

[keys]
previous_agent = "prefix+h"
next_agent = "prefix+l"
focus_agent = "prefix+alt+1..9"
